<head>
<style>
    *{border: 1px solid rgb(79, 30, 255);
        .container{min-height: 100vh;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap
            justify-content: space-between;
            align-items: center;
            align-content: space-evenly;
        }
    }
    .box1 { width: 100px; display: flex-shrink: 0;
    .box5 {order: -2;flex-grow: 1;}

    .box2 {order: 2;}
    .box3 {order: 3;}
    .box4 {order: 4;}
    }
</style>

<body>

        <div class="box1" id="box1">Box 1</div>
        <div class="box2" id="box2">Box 2</div>

        <div class="box5" id="box5">Box 5</div>
